<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- BlockHabit 应用图标：一块积木 + 一个对勾（墨黑/纸白/琥珀） -->
  <rect width="512" height="512" fill="#0A0A0A"/>

  <!-- 微微倾斜的积木主体 -->
  <g transform="rotate(-6 256 280)">
    <!-- 琥珀凸点（乐高 stud） -->
    <rect x="201" y="140" width="110" height="48" rx="24" fill="#F5B301"/>
    <!-- 纸白砖体 -->
    <rect x="116" y="172" width="280" height="216" rx="56" fill="#FAFAFA"/>
    <!-- 负形对勾：打卡完成 -->
    <path d="M186 288 L238 342 L330 232"
          fill="none" stroke="#0A0A0A" stroke-width="38"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
