<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- BlockHabit mark：圆角积木拼成的小城堡 + 琥珀旗（三色：墨黑/纸白/琥珀） -->
  <rect width="512" height="512" rx="112" fill="#0A0A0A"/>

  <!-- 底排两块积木 -->
  <rect x="96" y="298" width="150" height="100" rx="30" fill="#FAFAFA"/>
  <rect x="266" y="298" width="150" height="100" rx="30" fill="#FAFAFA"/>
  <!-- 顶排居中塔块 -->
  <rect x="181" y="194" width="150" height="100" rx="30" fill="#FAFAFA"/>

  <!-- 凸点（乐高 stud）：底部两块各一 -->
  <rect x="146" y="282" width="50" height="24" rx="12" fill="#FAFAFA"/>
  <rect x="316" y="282" width="50" height="24" rx="12" fill="#FAFAFA"/>
  <!-- 塔块凸点被旗杆取代，改放在塔顶两侧 -->
  <rect x="196" y="178" width="34" height="20" rx="10" fill="#FAFAFA"/>
  <rect x="282" y="178" width="34" height="20" rx="10" fill="#FAFAFA"/>

  <!-- 旗杆 + 琥珀旗 -->
  <rect x="249" y="92" width="14" height="96" rx="7" fill="#FAFAFA"/>
  <path d="M263 100 h74 a14 14 0 0 1 0 44 h-74 z" fill="#F5B301"/>

  <!-- 脸：负形双眼 + 琥珀腮红 -->
  <circle cx="222" cy="238" r="11" fill="#0A0A0A"/>
  <circle cx="290" cy="238" r="11" fill="#0A0A0A"/>
  <circle cx="204" cy="262" r="9" fill="#F5B301"/>
  <circle cx="308" cy="262" r="9" fill="#F5B301"/>
</svg>
