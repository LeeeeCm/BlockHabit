<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- BlockHabit：五块积木边贴边拼成对勾（ip-as-logo 方法论：5 形状 / 3 色 / 下角构图） -->
  <rect width="512" height="512" rx="112" fill="#0A0A0A"/>

  <!-- 网格步进 88，砖 88×88，边贴边；描边即砖缝 -->
  <g stroke="#0A0A0A" stroke-width="6">
    <!-- 短臂 -->
    <rect x="36" y="256" width="88" height="88" rx="22" fill="#FAFAFA"/>
    <!-- 顶点（左下角探出） -->
    <rect x="124" y="344" width="88" height="88" rx="22" fill="#FAFAFA"/>
    <!-- 长臂 -->
    <rect x="212" y="256" width="88" height="88" rx="22" fill="#FAFAFA"/>
    <rect x="300" y="144" width="88" height="88" rx="22" fill="#FAFAFA"/>
    <!-- 末端：绿色完成块 -->
    <rect x="388" y="80" width="88" height="88" rx="22" fill="#22C55E"/>
  </g>

  <!-- 俯视凸点 -->
  <g fill="none" stroke="#0A0A0A" stroke-width="6">
    <circle cx="80" cy="300" r="16"/>
    <circle cx="168" cy="388" r="16"/>
    <circle cx="256" cy="300" r="16"/>
    <circle cx="344" cy="188" r="16"/>
    <circle cx="432" cy="124" r="16"/>
  </g>
</svg>
